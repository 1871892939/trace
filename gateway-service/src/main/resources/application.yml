server:
  port: 8082

spring:
  application:
    name: gateway-service

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: public
      config:
        server-addr: localhost:8848
        file-extension: yaml
        namespace: public
        import-check:
          enabled: false

    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: core-service
          uri: lb://core-service
          predicates:
            - Path=/api/**
          filters:
            - StripPrefix=1

        - id: websocket-route
          uri: lb://core-service
          predicates:
            - Path=/ws/**
          filters:
            - StripPrefix=1

  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 5000ms

  # Sentinel 配置
  sentinel:
    enabled: true
    eager: true

jwt:
  secret: trace-food-safety-secret-key-2026
  expiration: 7200000

logging:
  level:
    com.ncg.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
